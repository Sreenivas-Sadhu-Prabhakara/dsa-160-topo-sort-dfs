<text x="56.0" y="604.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Pop everything: one valid order, e.g. [4,5,0,2,3,1]. Kahn's and DFS both run O(V+E)</text>
<text x="56.0" y="623.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">— Kahn gives you cycle detection for free, DFS gives finish times (useful for SCCs</text>
