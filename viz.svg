<text x="56.0" y="325.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">DFS from each unvisited node, pushing a node onto a stack AT FINISH time: deep</text>
<text x="56.0" y="344.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">dependents (like 1) finish early and sink to the stack's bottom; roots finish late</text>
<text x="56.0" y="363.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">and surface on top.</text>
